<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3e9">
  <title>顺风，慢行 · 鹈鹕的海边骑行</title>
  <style>
    :root { color-scheme: light; --paper:#f6f3e9; --ink:#244c48; --muted:#607570; --line:#d3d9cc; --orange:#d96540; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    main { width:min(1160px,calc(100% - 80px)); margin:38px auto 24px; }
    .masthead { display:flex; justify-content:space-between; align-items:center; gap:20px; padding-bottom:18px; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:11px; font-size:12px; font-weight:700; letter-spacing:2.4px; }
    .brand svg { width:34px; height:34px; }
    .edition { color:var(--muted); font:11px/1.5 ui-monospace,monospace; letter-spacing:1.5px; }
    .intro { display:flex; justify-content:space-between; align-items:end; gap:24px; padding:28px 0 25px; }
    .eyebrow { margin:0 0 9px; font-size:11px; letter-spacing:3px; font-weight:600; color:var(--muted); }
    h1 { margin:0; font-family:"Noto Serif CJK SC","Songti SC",SimSun,serif; font-size:clamp(30px,4vw,46px); font-weight:600; letter-spacing:3px; line-height:1.4; }
    h1 span { color:var(--orange); }
    .intro-note { margin:0 0 5px; font-size:13px; line-height:1.9; color:var(--muted); text-align:right; letter-spacing:1px; }
    .postcard { position:relative; overflow:hidden; border:1px solid #bfccbc; border-radius:16px; background:#eaf0dd; }
    .scene { display:block; width:100%; height:auto; aspect-ratio:1200 / 640; }
    .scene-label { position:absolute; top:24px; left:26px; display:flex; align-items:center; gap:9px; color:#466359; font:10px/1.5 ui-monospace,monospace; letter-spacing:2px; }
    .scene-label::before { content:""; width:6px; height:6px; border-radius:50%; background:#527765; }
    .scene-caption { position:absolute; bottom:22px; right:27px; font:italic 17px Georgia,serif; color:#536b58; }
    .controls { display:flex; align-items:center; gap:16px; padding:20px 0; border-bottom:1px solid var(--line); }
    button { display:inline-flex; justify-content:center; align-items:center; gap:9px; min-height:44px; border:1px solid var(--line); padding:0 18px; border-radius:999px; background:transparent; color:var(--ink); font-size:13px; font-weight:500; line-height:1.4; font-family:inherit; cursor:pointer; transition:background .18s,transform .18s; touch-action:manipulation; }
    button:hover { background:#e9ecdf; }
    button:active { transform:translateY(1px); }
    button:focus-visible,input:focus-visible { outline:3px solid var(--orange); outline-offset:4px; }
    button svg { width:16px; height:16px; flex-shrink:0; }
    .primary { background:var(--ink); border-color:var(--ink); color:var(--paper); min-width:120px; }
    .primary:hover { background:#39645d; }
    .speed-control { display:flex; align-items:center; gap:14px; margin-left:10px; font-size:12px; }
    .speed-control label { color:var(--muted); white-space:nowrap; }
    input[type=range] { width:128px; height:44px; margin:0; accent-color:var(--ink); cursor:pointer; }
    output { width:38px; font:12px ui-monospace,monospace; }
    .bell { margin-left:auto; }
    footer { display:flex; justify-content:space-between; gap:16px; padding-top:17px; color:var(--muted); font-size:11px; letter-spacing:1px; }
    .footer-right { font:10px/1.7 ui-monospace,monospace; letter-spacing:1.8px; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0; }
    @media (max-width:640px) {
      main { width:calc(100% - 32px); margin-top:22px; }
      .brand { font-size:10px; letter-spacing:1.5px; gap:8px; }
      .edition { font-size:9px; letter-spacing:0; }
      .intro { padding:24px 0 19px; display:block; }
      .intro-note { text-align:left; margin:10px 0 0; font-size:12px; }
      .intro-note br { display:none; }
      .scene { aspect-ratio:4 / 3; }
      .scene-label { top:15px; left:15px; font-size:8px; letter-spacing:1px; }
      .scene-caption { bottom:15px; right:16px; font-size:13px; }
      .controls { gap:10px; flex-wrap:wrap; padding:16px 0; }
      button { padding:0 15px; }
      .primary { min-width:112px; }
      .speed-control { order:3; justify-content:center; flex:1 0 100%; margin:0; }
      input[type=range] { flex:1; max-width:220px; }
      footer { font-size:10px; }
      .footer-right { font-size:9px; letter-spacing:.6px; }
    }
    @media (prefers-reduced-motion:reduce) { button { transition:none; } }
  </style>
</head>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  let playing = !reducedMotion.matches, speed = 1, elapsed = 0, previous = 0, frame = 0;
  let bellUntil = 0, audio;
  const parts = Object.fromEntries(['rear-spokes','front-spokes','crank','body','wing','eye','scarf-tail','scarf-fold','clouds','gulls','ripples','shore','road','foreground','bell-rings'].map(id => [id,$(id)]));
  const legs = ['far','near'].map(side => ({ line:$(side+'-leg-line'), color:$(side+'-leg-color'), foot:$(side+'-foot'), toes:$(side+'-toes'), pedal:$(side+'-pedal') }));
  const transform = (id, value) => parts[id].setAttribute('transform',value);

  function drawLeg(index, angle, bob) {
    const leg = legs[index], px = 594 + Math.cos(angle)*31, py = 480 + Math.sin(angle)*31;
    const hx = index ? 572 : 555, hy = 334 + bob;
    const ax = px-10, ay = py-11, dx = ax-hx, dy = ay-hy, distance = Math.hypot(dx,dy);
    // A two-segment leg bends at the knee while its ankle follows the pedal.
    const bend = Math.sqrt(Math.max(0,94*94-distance*distance/4));
    const kx = (hx+ax)/2+dy/distance*bend, ky = (hy+ay)/2-dx/distance*bend;
    const line = `M${hx} ${hy}L${kx} ${ky}L${ax} ${ay}`;
    leg.line.setAttribute('d',line);
    if (leg.color) leg.color.setAttribute('d',line);
    leg.foot.setAttribute('d',`M${ax-5} ${ay-5}Q${ax+3} ${ay-12} ${ax+8} ${ay-1}L${px+22} ${py-1}L${px+16} ${py+3}L${px+5} ${py+1}L${px-1} ${py+4}L${px-17} ${py}Z`);
    if (leg.toes) leg.toes.setAttribute('d',`M${px-3} ${py-6}L${px+5} ${py+1}M${px+3} ${py-6}L${px+16} ${py+3}`);
    leg.pedal.setAttribute('d',`M${px-17} ${py+5}H${px+19}`);
  }

  function draw(t) {
    const angle = t*3.3, bob = Math.sin(angle*2)*2, wheelDegrees = t*170/88*180/Math.PI;
    transform('rear-spokes',`rotate(${wheelDegrees})`);
    transform('front-spokes',`rotate(${wheelDegrees})`);
    transform('crank',`translate(594 480) rotate(${angle*180/Math.PI})`);
    transform('body',`translate(0 ${bob})`);
    // The wing pivots around the handlebar so its tip keeps a steady grip.
    transform('wing',`rotate(${-bob*.28} 706 315)`);
    drawLeg(0,angle+Math.PI,bob);
    drawLeg(1,angle,bob);
    const flutter = Math.sin(t*7)*7;
    parts['scarf-tail'].setAttribute('d',`M615 223C587 ${212+flutter} 564 ${234-flutter} 531 ${215+flutter}L538 ${235+flutter}C565 ${252-flutter} 593 ${223+flutter} 620 239Z`);
    parts['scarf-fold'].setAttribute('d',`M612 229Q575 ${226+flutter} 544 ${231+flutter*.5}`);
    const blink = t%5.7;
    transform('eye',`translate(642 151) scale(1 ${blink>5.48 ? Math.max(.08,Math.abs(blink-5.59)/.11) : 1})`);
    transform('clouds',`translate(${-t*8%1200} 0)`);
    transform('gulls',`translate(${Math.sin(t*.32)*22} ${Math.sin(t*.85)*3})`);
    transform('ripples',`translate(${-t*13%1200} 0)`);
    transform('shore',`translate(${-t*40%1200} 0)`);
    transform('road',`translate(${-t*170%1200} 0)`);
    transform('foreground',`translate(${-t*205%1200} 0)`);
  }

  function tick(now) {
    frame = 0;
    if (document.hidden) { previous = 0; return; }
    const dt = previous ? Math.min((now-previous)/1000,.05) : 0;
    previous = now;
    if (playing) { elapsed += dt*speed; draw(elapsed); }
    const ringing = Math.max(0,(bellUntil-now)/1100);
    parts['bell-rings'].setAttribute('opacity',String(ringing));
    transform('bell-rings',`translate(0 ${-6*(1-ringing)})`);
    if (playing || ringing) frame = requestAnimationFrame(tick);
    else previous = 0;
  }
  function wake() { if (!frame && !document.hidden) { previous = 0; frame = requestAnimationFrame(tick); } }
  function setPlaying(value) {
    playing = value;
    $('toggle-label').textContent = playing ? '歇一会儿' : '继续出发';
    $('toggle').setAttribute('aria-label',playing ? '暂停动画' : '播放动画');
    $('toggle-icon').setAttribute('d',playing ? 'M4 3h3v10H4zM9 3h3v10H9z' : 'M4 2l10 6-10 6z');
    wake();
  }
  $('toggle').addEventListener('click',() => setPlaying(!playing));
  $('speed').addEventListener('input',event => {
    speed = Number(event.target.value);
    $('speed-value').value = speed.toFixed(2).replace(/0$/,'')+'×';
    event.target.setAttribute('aria-valuetext',speed+' 倍速');
  });
  $('bell').addEventListener('click',async () => {
    bellUntil = performance.now()+1100;
    $('announcement').textContent = '叮铃铃，一路好心情。';
    wake();
    try {
      const Audio = window.AudioContext || window.webkitAudioContext;
      if (!Audio) return;
      audio ||= new Audio();
      await audio.resume();
      for (const delay of [0,.16]) {
        const start = audio.currentTime+delay;
        for (const [frequency,volume] of [[1568,.12],[2352,.035]]) {
          const oscillator = audio.createOscillator(), gain = audio.createGain();
          oscillator.frequency.value = frequency;
          gain.gain.setValueAtTime(0,start);
          gain.gain.linearRampToValueAtTime(volume,start+.006);
          gain.gain.exponentialRampToValueAtTime(.0001,start+.7);
          oscillator.connect(gain); gain.connect(audio.destination);
          oscillator.start(start); oscillator.stop(start+.72);
          oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
        }
      }
    } catch { $('announcement').textContent = '叮铃铃。当前浏览器无法播放声音。'; }
  });
  document.addEventListener('visibilitychange',() => {
    if (document.hidden) { cancelAnimationFrame(frame); frame = 0; previous = 0; }
    else wake();
  });
  reducedMotion.addEventListener('change',event => { if (event.matches) setPlaying(false); });
  draw(0);
  setPlaying(playing);
})();
</script>
</body>
</html>
